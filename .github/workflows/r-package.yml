name: R package

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  r-api-tinytest:
    name: R API tinytest (non-network) (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ROPENDAL_TEST_NETWORK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::tinytest
          needs: check
      - name: Fast non-network tests
        run: make test-fast

  c-api-contract:
    name: C API contract and CI-only tests
    runs-on: ubuntu-latest
    env:
      ROPENDAL_TEST_CI: "true"
      ROPENDAL_TEST_NETWORK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::tinytest
          needs: check
      - name: Rust unit tests
        run: make test-rust
      - name: Source header compile check
        run: make test-c-api-header
      - name: Installed native API contract tests
        run: make test-ci

  s3-minio:
    name: Local SeaweedFS S3-compatible tests
    runs-on: ubuntu-latest
    env:
      ROPENDAL_S3_MINIO_ENDPOINT: http://127.0.0.1:8333
      ROPENDAL_S3_MINIO_BUCKET: ropendal-test
      ROPENDAL_S3_MINIO_REGION: us-east-1
      ROPENDAL_S3_MINIO_ACCESS_KEY_ID: minioadmin
      ROPENDAL_S3_MINIO_SECRET_ACCESS_KEY: minioadmin
      ROPENDAL_S3_MINIO_ROOT: ropendal-ci
    services:
      seaweedfs:
        image: chrislusf/seaweedfs:4.52@sha256:a54ba35b44895a449f5cdd415999062201b17b9835ec0ffc19ea605b72ffa3d1
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          S3_BUCKET: ropendal-test
        ports:
          - 8333:8333
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::tinytest
          needs: check
      - name: Wait for SeaweedFS S3 endpoint
        run: |
          for _ in $(seq 1 60); do
            if curl -sS --connect-timeout 1 http://127.0.0.1:8333/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Writable S3-compatible tests against local SeaweedFS
        run: make test-s3-minio

  sftp:
    name: Local SFTP tests (key and password)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::tinytest
          needs: check
      - name: Key- and password-authenticated SFTP tests against a local container
        run: make test-sftp

  r-cmd-check:
    name: R CMD check (no CI-only/network tests) (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ROPENDAL_TEST_CI: "false"
      ROPENDAL_TEST_NETWORK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
